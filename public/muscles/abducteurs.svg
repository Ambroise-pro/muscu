<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-labelledby="title desc">
  <title id="title">Abducteurs</title>
  <desc id="desc">Schéma du muscle Abducteurs en surbrillance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#020617" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="400" height="520" fill="url(#bg)" rx="28" />
  <circle cx="74" cy="72" r="50" fill="#1d4ed8" opacity="0.12" />
  <circle cx="332" cy="460" r="64" fill="#06b6d4" opacity="0.10" />

  <g filter="url(#shadow)">
    <g class="silhouette">
      
<ellipse cx="200" cy="84" rx="36" ry="44" class="body" />
<rect x="168" y="128" width="64" height="150" rx="30" class="body" />
<rect x="132" y="138" width="30" height="162" rx="16" class="body" />
<rect x="238" y="138" width="30" height="162" rx="16" class="body" />
<rect x="162" y="274" width="34" height="188" rx="18" class="body" />
<rect x="204" y="274" width="34" height="188" rx="18" class="body" />
<rect x="162" y="462" width="34" height="16" rx="6" class="body" />
<rect x="204" y="462" width="34" height="16" rx="6" class="body" />

    </g>
    <g class="highlights">
      <rect x="154" y="302" width="16" height="84" rx="6" class="hl" />
<rect x="234" y="302" width="16" height="84" rx="6" class="hl" />
    </g>
  </g>

  <text x="200" y="40" class="label" text-anchor="middle">Abducteurs</text>

  <style>
    .body { fill: url(#bodyGrad); opacity: 0.9; }
    .hl { fill: #22d3ee; opacity: 0.9; stroke: #67e8f9; stroke-width: 1; }
    .label { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #e2e8f0; letter-spacing: 0.4px; }
  </style>
</svg>
